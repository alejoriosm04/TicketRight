<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TicketRight — Plataforma de venta de boletas</title>
<link rel="stylesheet" href="estilos.css">
<script>(function(){try{document.documentElement.setAttribute('data-tema', localStorage.getItem('tr-tema')||'dark');}catch(e){}})();</script>
<style>
  .tr-top { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:22px; padding:14px 28px; background:var(--color-surface); border-bottom:1px solid var(--color-border); }
  .tr-logo { font-family:var(--font-heading); font-weight:800; font-size:21px; letter-spacing:-.02em; cursor:pointer; }
  .tr-logo span { color:var(--color-primary); }
  .tr-nav { display:flex; gap:6px; }
  .tr-nav a { padding:8px 14px; border-radius:8px; color:var(--color-text-muted); font-size:14px; text-decoration:none; }
  .tr-nav a.on, .tr-nav a:hover { background:var(--color-surface-overlay); color:var(--color-text); }
  .tr-cuenta { margin-left:auto; display:flex; align-items:center; gap:10px; color:var(--color-text-muted); font-size:14px; }
  .tr-avatar { width:34px; height:34px; border-radius:50%; background:var(--color-primary); color:var(--color-primary-text-on); display:grid; place-items:center; font-weight:700; }
  #app { max-width:1080px; margin:0 auto; padding:0 28px 72px; }

  .tr-hero { padding:44px 0 26px; }
  .tr-hero h1 { font-size:36px; line-height:1.08; margin:8px 0 18px; }
  .tr-buscador { display:flex; gap:8px; max-width:540px; }
  .tr-buscador input { flex:1; background:var(--color-surface-overlay); border:1px solid var(--color-border); color:var(--color-text); border-radius:10px; padding:13px 15px; font-size:15px; }
  .tr-cats { display:flex; gap:10px; flex-wrap:wrap; margin:22px 0 4px; }
  .tr-cat { padding:7px 15px; border-radius:999px; border:1px solid var(--color-border); color:var(--color-text-muted); font-size:14px; cursor:pointer; }
  .tr-cat.on { background:var(--color-primary); color:var(--color-primary-text-on); border-color:transparent; }
  .tr-h2 { font-size:20px; margin:28px 0 16px; }
  .tr-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:20px; }
  .tr-card { border:1px solid var(--color-border); border-radius:16px; overflow:hidden; background:var(--color-surface); cursor:pointer; transition:transform .15s, border-color .15s; }
  .tr-card:hover { transform:translateY(-3px); border-color:var(--color-primary); }
  .tr-portada { height:150px; background:linear-gradient(135deg,var(--color-primary),#7c5cff); position:relative; display:grid; place-items:center; }
  .tr-portada .emoji { font-size:54px; filter:drop-shadow(0 4px 12px rgba(0,0,0,.35)); }
  .tr-portada .insignia { position:absolute; top:12px; left:12px; }
  .tr-card .cuerpo { padding:16px; }
  .tr-card h3 { font-size:17px; margin-bottom:6px; }
  .tr-card .lugar { color:var(--color-text-muted); font-size:13px; margin-bottom:8px; }
  .tr-demanda { color:var(--color-warning,#d97706); font-size:13px; font-weight:600; margin-bottom:12px; }
  .tr-card .pie { display:flex; justify-content:space-between; align-items:center; }
  .tr-card .precio { font-weight:700; }
  .btn-sm { padding:6px 12px; font-size:13px; }

  .tr-volver { display:inline-block; margin:20px 0 8px; color:var(--color-text-muted); text-decoration:none; font-size:14px; }
  .tr-detalle { display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:8px; }
  .tr-detalle-portada { height:280px; border-radius:18px; background:linear-gradient(135deg,var(--color-primary),#7c5cff); display:grid; place-items:center; }
  .tr-detalle-portada .emoji { font-size:90px; }
  .tr-detalle-info h1 { font-size:30px; margin:6px 0 10px; }
  .tr-mut { color:var(--color-text-muted); }
  .tr-mini { font-size:12px; color:var(--color-text-muted); }
  .tr-mt { margin-top:16px; }

  .tr-centro { max-width:520px; margin:40px auto 0; }
  .tr-centro-1 { max-width:460px; margin:0 auto; }
  .tr-centro-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  .tr-txt-centro { text-align:center; }

  .tr-fila-card { text-align:center; }
  .tr-spinner { width:46px; height:46px; border:4px solid var(--color-border); border-top-color:var(--color-primary); border-radius:50%; animation:trg 1s linear infinite; margin:6px auto 16px; }
  @keyframes trg { to { transform:rotate(360deg); } }
  .tr-pista { position:relative; height:8px; background:var(--color-surface-overlay); border-radius:8px; margin:20px 0; }
  .tr-avance { position:absolute; left:0; top:0; bottom:0; background:var(--color-primary); border-radius:8px; transition:width .5s; }
  .tr-icono { position:absolute; top:-9px; transition:left .5s; }
  .tr-meta { position:absolute; right:-4px; top:-9px; }

  .tr-sel-layout { display:grid; grid-template-columns:1.4fr 1fr; gap:20px; align-items:start; }
  .tr-leyenda { display:flex; gap:18px; margin-top:12px; font-size:13px; color:var(--color-text-muted); }
  .tr-muestra { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:middle; }
  .tr-m-ok { background:var(--color-primary); } .tr-m-warn { background:var(--color-warning,#d97706); } .tr-m-off { background:var(--color-danger,#dc2626); }
  .tr-zona.sel rect { stroke-width:3.5; }
  .tr-disp { margin:14px 0; }
  .tr-disp-rot { display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
  .tr-disp-pista { height:8px; background:var(--color-surface-overlay); border-radius:6px; overflow:hidden; }
  .tr-disp-fill { height:100%; background:var(--color-primary); } .tr-disp-fill.peligro { background:var(--color-danger,#dc2626); }
  .tr-lbl { display:block; font-size:13px; font-weight:600; color:var(--color-text-muted); margin:16px 0 6px; }
  .tr-contador { display:flex; align-items:center; gap:14px; }
  .tr-contador button { width:40px; height:40px; border-radius:10px; border:1px solid var(--color-border); background:var(--color-surface-overlay); color:var(--color-text); font-size:20px; cursor:pointer; }
  .tr-contador #cifra { font-size:20px; font-weight:700; min-width:24px; text-align:center; }
  .tr-barra-total { position:sticky; bottom:0; display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:14px; padding:14px 20px; margin-top:20px; box-shadow:0 -4px 20px rgba(0,0,0,.15); }
  .tr-bt-info { display:flex; flex-direction:column; } .tr-bt-cifra { font-size:22px; font-weight:800; }

  .tr-anillo { display:flex; justify-content:center; margin:10px 0; } .tr-anillo svg { width:160px; height:160px; }
  .tr-cancelar { display:block; text-align:center; margin-top:12px; color:var(--color-text-muted); font-size:13px; cursor:pointer; }

  .tr-campo { margin-bottom:14px; } .tr-campo label { display:block; font-size:13px; color:var(--color-text-muted); margin-bottom:6px; }
  .tr-campo input, .tr-campo select { width:100%; background:var(--color-surface-overlay); border:1px solid var(--color-border); color:var(--color-text); border-radius:10px; padding:12px 14px; font-size:15px; }
  .tr-nota { font-size:13px; border:1px solid var(--color-border); border-radius:10px; padding:11px 13px; margin-bottom:14px; color:var(--color-text-muted); }

  .tr-boleta { border:1px dashed var(--color-primary); border-radius:14px; padding:18px; margin-bottom:12px; background:var(--color-surface-overlay); text-align:center; }
  .tr-boleta-cab { display:flex; justify-content:space-between; align-items:center; }
  .tr-qr { font-size:64px; line-height:1; margin:12px 0; letter-spacing:-6px; }
  .tr-cod { font-family:monospace; font-weight:700; letter-spacing:1px; font-size:14px; word-break:break-all; }

  .tr-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; }
  .tr-kpi { border:1px solid var(--color-border); border-radius:14px; padding:18px; }
  .tr-kpi-v { font-size:28px; font-weight:800; } .tr-kpi-t { font-size:13px; color:var(--color-text-muted); margin-top:4px; }
  .tr-kpi-green .tr-kpi-v { color:var(--color-success,#16a34a); } .tr-kpi-blue .tr-kpi-v { color:#3b82f6; }
  .tr-kpi-purple .tr-kpi-v { color:#8b5cf6; } .tr-kpi-orange .tr-kpi-v { color:var(--color-warning,#d97706); }
  .tr-kpi-red .tr-kpi-v { color:var(--color-danger,#dc2626); }

  .tr-toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--color-danger,#dc2626); color:#fff; padding:12px 20px; border-radius:10px; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s; }
  .tr-toast.on { opacity:1; }

  @media (max-width:760px){ .tr-detalle,.tr-centro-2,.tr-sel-layout{grid-template-columns:1fr} .tr-nav a{padding:8px 9px} }
</style>
</head>
<body>

<div class="tr-top">
  <div class="tr-logo" onclick="location.hash='#/eventos'">Ticket<span>Right</span></div>
  <nav class="tr-nav">
    <a href="#/eventos" data-ruta="eventos">Eventos</a>
    <a href="#/promotor" data-ruta="promotor">Promotor</a>
    <a href="#/operacion" data-ruta="operacion">Operación</a>
  </nav>
  <div class="tr-cuenta"><span>Bogotá</span><div class="tr-avatar">Q</div></div>
</div>

<main id="app"></main>
<div class="tr-toast" id="toast"></div>

<script src="plataforma.js"></script>
</body>
</html>
