<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TicketRight — Boleta</title>
<link rel="stylesheet" href="estilos.css">
<script>(function(){try{document.documentElement.setAttribute('data-tema', localStorage.getItem('tr-tema')||'dark');}catch(e){}})();</script>
</head>
<body>
<div class="app-layout">
  <aside class="barra-lateral" id="barra-lateral"></aside>
  <main class="contenido-principal">
    <div class="contenedor">

      <div class="encabezado-pagina">
        <span class="etiqueta">Boleta <span id="indice-boleta">1</span> de <span id="total-boletas">2</span> · estado emitida</span>
        <h1>Listo, tus boletas ya son tuyas</h1>
      </div>

      <div class="tarjeta" style="text-align:center">
        <svg class="qr-boleta" viewBox="0 0 100 100" aria-hidden="true">
          <rect x="5" y="5" width="25" height="25" fill="none" stroke="var(--color-accent-text)" stroke-width="7"/>
          <rect x="13" y="13" width="9" height="9" fill="var(--color-accent-text)"/>
          <rect x="70" y="5" width="25" height="25" fill="none" stroke="var(--color-accent-text)" stroke-width="7"/>
          <rect x="78" y="13" width="9" height="9" fill="var(--color-accent-text)"/>
          <rect x="5" y="70" width="25" height="25" fill="none" stroke="var(--color-accent-text)" stroke-width="7"/>
          <rect x="13" y="78" width="9" height="9" fill="var(--color-accent-text)"/>
          <g fill="var(--color-accent-text)">
            <rect x="40" y="10" width="7" height="7"/><rect x="52" y="18" width="7" height="7"/>
            <rect x="62" y="10" width="7" height="7"/><rect x="45" y="30" width="7" height="7"/>
            <rect x="60" y="35" width="7" height="7"/><rect x="40" y="45" width="7" height="7"/>
            <rect x="55" y="50" width="7" height="7"/><rect x="70" y="45" width="7" height="7"/>
            <rect x="35" y="60" width="7" height="7"/><rect x="50" y="65" width="7" height="7"/>
            <rect x="65" y="60" width="7" height="7"/><rect x="80" y="65" width="7" height="7"/>
            <rect x="45" y="80" width="7" height="7"/><rect x="60" y="80" width="7" height="7"/>
            <rect x="75" y="80" width="7" height="7"/><rect x="20" y="40" width="7" height="7"/>
            <rect x="15" y="50" width="7" height="7"/><rect x="80" y="20" width="7" height="7"/>
            <rect x="85" y="35" width="7" height="7"/>
          </g>
        </svg>
        <p style="font-size:12px;color:var(--color-text-muted);margin-bottom:16px">Versión <span id="qr-version">1</span></p>
        <h2>Cardio Fest — Estéreo Picnic</h2>
        <p style="margin-top:8px">General · Titular: Quinn Villa</p>
      </div>

      <div class="tarjeta">
        <div class="fila-datos"><span class="k">Código de boleta</span><span class="v" id="codigo-boleta">TR-9C21-A0</span></div>
        <div class="fila-datos"><span class="k">Estado</span><span class="v"><span class="insignia insignia-exito">emitida</span></span></div>
        <div class="fila-datos"><span class="k">Titular</span><span class="v">Quinn Villa (activo)</span></div>
        <div class="fila-datos"><span class="k">Transferible</span><span class="v">Sí, dentro de las reglas del evento</span></div>
      </div>

      <div class="paginador-boletas">
        <button type="button" class="btn btn-secundario" id="btn-boleta-anterior" disabled>‹ Boleta anterior</button>
        <button type="button" class="btn btn-secundario" id="btn-boleta-siguiente">Siguiente boleta ›</button>
      </div>

      <a href="fan-eventos.html" class="btn btn-secundario btn-ancho">Buscar otro evento</a>

    </div>
  </main>
</div>
<script src="nav.js"></script>
<script>
  var boletas = [
    { codigo: 'TR-9C21-A0', version: 1 },
    { codigo: 'TR-9C21-A1', version: 1 }
  ];
  var indice = 0;
  var btnAnterior = document.getElementById('btn-boleta-anterior');
  var btnSiguiente = document.getElementById('btn-boleta-siguiente');

  function pintarBoleta() {
    document.getElementById('indice-boleta').textContent = indice + 1;
    document.getElementById('codigo-boleta').textContent = boletas[indice].codigo;
    document.getElementById('qr-version').textContent = boletas[indice].version;
    btnAnterior.disabled = indice === 0;
    btnSiguiente.disabled = indice === boletas.length - 1;
  }
  btnAnterior.addEventListener('click', function () { if (indice > 0) { indice -= 1; pintarBoleta(); } });
  btnSiguiente.addEventListener('click', function () { if (indice < boletas.length - 1) { indice += 1; pintarBoleta(); } });
  pintarBoleta();
</script>
</body>
</html>
