global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # La API de ventas corre en el host (puerto 3000); Prometheus la alcanza por
  # host.docker.internal, expuesto por Docker Desktop hacia el host de Windows.
  - job_name: ticketright-ventas
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          service: ventas
