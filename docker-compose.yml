name: ticketright

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ticketright
      POSTGRES_USER: ticketright
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketright -d ticketright"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis: proyección operativa de la fila Space-Based y modelos de lectura (AD-006, AD-003).
  # En producción es Amazon ElastiCache for Redis. redis:7-alpine es liviano y estable.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Apache Kafka en modo KRaft (bus de eventos durable, AD-002). Se fija un heap
  # pequeño y un límite de memoria para que el broker no ahogue la máquina local; en
  # producción es Amazon MSK. Escucha en 9092 para el host y 29092 dentro de la red.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    mem_limit: 900m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # Observabilidad (Entrega 3, criterio 2). La API de ventas corre en el host y
  # Prometheus la raspa por host.docker.internal. Grafana provisiona el datasource
  # y el tablero automáticamente al arrancar.
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-datos:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Trazas distribuidas de la compra (admisión → reserva → pago → emisión).
  tempo:
    image: grafana/tempo:2.7.0
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-datos:/var/tempo

  # Logs estructurados en JSON con el esquema del diseño.
  loki:
    image: grafana/loki:3.4.1
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-datos:/loki

  # Grafana Alloy: puerta OTLP (recibe trazas de la app, las envía a Tempo) y
  # recolector de logs (lee el archivo de la app y lo envía a Loki).
  alloy:
    image: grafana/alloy:v1.7.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "4318:4318"
      - "4317:4317"
      - "12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./observability/logs:/var/log/ticketright:ro
    depends_on:
      - tempo
      - loki

  grafana:
    image: grafana/grafana:11.5.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-datos:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  postgres-datos:
  prometheus-datos:
  grafana-datos:
  tempo-datos:
  loki-datos:
