# Configuración (ConfigMap) y secretos (Secret) del servicio de ventas.
# En producción los secretos vienen de AWS Secrets Manager vía External Secrets Operator;
# aquí es un Secret de Kubernetes (AD-004: los secretos no viven en Git ni en imágenes).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ventas-config
  namespace: ventas
data:
  PORT: "3000"
  PASARELA_PERFIL: "normal"
  PASARELA_RETRASO_MS: "500"
  DATABASE_URL: "postgres://ticketright:ticketright@postgres:5432/ticketright"
  REDIS_URL: "redis://redis:6379"
  KAFKA_BROKERS: "kafka:9092"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.observabilidad:4318"
  DEPLOY_ENV: "minikube"
  LOG_LEVEL: "info"
  SONDA_INTERVALO_MS: "60000"
---
apiVersion: v1
kind: Secret
metadata:
  name: ventas-secrets
  namespace: ventas
type: Opaque
stringData:
  # Secreto de firma del token de admisión (homólogo de una llave de Secrets Manager/KMS).
  ADMISION_SECRET: "minikube-secreto-admision-ticketright"
  POSTGRES_PASSWORD: "ticketright"
